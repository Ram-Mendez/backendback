spring.flyway.locations=classpath:db/migration,classpath:devdata

app.security.jwt-secret=test-local-ram-jwt-secret-change-before-production-2026
app.security.access-token-ttl=15m
app.security.refresh-token-ttl=7d
app.security.cors-allowed-origins=http://localhost:4200,http://127.0.0.1:4200

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.attachments.local-storage-root=${java.io.tmpdir}/ram-test-attachments
app.attachments.max-file-size=1KB
app.attachments.max-request-size=2KB
app.attachments.max-files-per-request=3
app.attachments.allowed-content-types=text/plain,application/pdf,image/png,image/jpeg,application/octet-stream
app.attachments.allowed-extensions=txt,pdf,png,jpg,jpeg
spring.servlet.multipart.max-file-size=1KB
spring.servlet.multipart.max-request-size=4KB
