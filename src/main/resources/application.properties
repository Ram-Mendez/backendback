spring.application.name=ram

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ram}
spring.datasource.username=${DB_USERNAME:ram}
spring.datasource.password=${DB_PASSWORD:ram}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.error.include-stacktrace=never
logging.pattern.level=%5p [correlationId=%X{correlationId:-}]

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.security.jwt-secret=${JWT_SECRET:${RAM_JWT_SECRET:dev-local-ram-jwt-secret-change-before-production-2026}}
app.security.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:45m}
app.security.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

app.attachments.local-storage-root=${ATTACHMENTS_STORAGE_ROOT:storage/attachments}
app.attachments.max-file-size=${ATTACHMENTS_MAX_FILE_SIZE:25MB}
app.attachments.max-request-size=${ATTACHMENTS_MAX_REQUEST_SIZE:500MB}
app.attachments.max-files-per-request=${ATTACHMENTS_MAX_FILES_PER_REQUEST:20}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:${ATTACHMENTS_MAX_FILE_SIZE:25MB}}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:${ATTACHMENTS_MAX_REQUEST_SIZE:500MB}}
