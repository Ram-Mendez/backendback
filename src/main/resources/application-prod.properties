spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.security.jwt-secret=${JWT_SECRET}
app.security.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.security.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
