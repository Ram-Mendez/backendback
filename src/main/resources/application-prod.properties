spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.security.jwt-secret=${JWT_SECRET}
app.security.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:45m}
app.security.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

app.attachments.local-storage-root=${ATTACHMENTS_STORAGE_ROOT:/app/storage/attachments}
app.attachments.max-file-size=${ATTACHMENTS_MAX_FILE_SIZE:25MB}
app.attachments.max-request-size=${ATTACHMENTS_MAX_REQUEST_SIZE:500MB}
app.attachments.max-files-per-request=${ATTACHMENTS_MAX_FILES_PER_REQUEST:20}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:${ATTACHMENTS_MAX_FILE_SIZE:25MB}}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:${ATTACHMENTS_MAX_REQUEST_SIZE:500MB}}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
