services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ram
      POSTGRES_USER: ram
      POSTGRES_PASSWORD: ram
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ram -d ram"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    profiles:
      - app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/ram
      DB_USERNAME: ram
      DB_PASSWORD: ram
      JWT_SECRET: dev-local-ram-jwt-secret-change-before-production-2026
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      ATTACHMENTS_STORAGE_ROOT: /app/storage/attachments
    volumes:
      - attachments-data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

  attachments-data: